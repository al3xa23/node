name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest
    name: "prepare:docker [${{ matrix.name }}]"
                
    steps:
    # - uses: actions/checkout@v4
    # - name: Build the Docker image
    #   run: docker build . --file packaging/docker/Dockerfile.fedora --tag my-image-name:$(date +%s)

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: fedora-minimal
      uses: docker/setup-buildx-action@v3
      with:
         file: packaging/Docker/Dockerfile.fedora-minimal
         push: true
         tags: fedora-minimal

