name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest
    name: "prepare:docker [${{ matrix.name }}]"
                
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: fedora-minimal
      uses: docker/build-push-action@v5
      with:
        context: .
        file: packaging/docker/Dockerfile.fedora-minimal
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/fedora-minimal:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fedora-minimal:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fedora-minimal:cache,mode=max
